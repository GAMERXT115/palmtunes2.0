name: Build iOS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build iOS
        shell: bash
        run: flutter build ios --release --no-codesign -v 2>&1 | tee build.log

      - name: Show linker errors
        if: failure()
        run: |
          grep -n -B1 -A3 "duplicate symbol" build.log | head -80
          echo "-----"
          grep -n "error:" build.log | head -30

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Package IPA
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r palmtunes.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: palmtunes-ios
          path: palmtunes.ipa