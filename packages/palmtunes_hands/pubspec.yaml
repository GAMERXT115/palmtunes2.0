name: palmtunes_hands
description: Native helpers for Palm Tunes - iOS hand tracking (MediaPipe) and the song bass analyzer for Android and iOS.
version: 1.1.0
publish_to: none

environment:
  sdk: ^3.13.5
  flutter: ">=3.3.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.palmtunes.hands
        pluginClass: PalmtunesHandsPlugin
      ios:
        pluginClass: PalmtunesHandsPlugin
