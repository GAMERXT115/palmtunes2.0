name: palmtunes
description: "Palm Tunes - music and video player with hand-gesture control (iPhone and Android)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2

  # Playback
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  audio_service: ^0.18.17
  audio_session: ^0.2.2
  wakelock_plus: ^1.2.8
  flutter_volume_controller: ^1.3.4

  # YouTube + downloads
  youtube_explode_dart: ^3.1.0
  http: ^1.6.0
  crypto: ^3.0.5
  uuid: ^4.5.1
  path: ^1.9.0
  path_provider: ^2.1.4

  # App
  shared_preferences: ^2.3.2
  excel: ^4.0.6
  share_plus: ^11.0.0
  url_launcher: ^6.3.1
  flutter_colorpicker: ^1.1.0

  # Hand gestures
  camera: ^0.12.2
  hand_landmarker: ^3.0.1
  palmtunes_hands:
    path: packages/palmtunes_hands

  # Account + cloud (same Firebase project as the desktop app)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1   # use the same version as the desktop pubspec
  cloud_firestore: ^7.1.0   # use the same version as the desktop pubspec
  local_auth: ^2.3.0     # Face ID / fingerprint

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  min_sdk_android: 24
  adaptive_icon_background: "#0A0A0D"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true

  assets:
    - cookies.txt
    - assets/legal/
    - assets/logo.png
    - assets/hand_landmarker.task